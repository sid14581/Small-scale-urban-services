<style>
        /* Base styles to enforce design system rules */
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;

        /* Hide number input spinners */

        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;

<body class="bg-background text-on-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Focused Transactional Container -->
<main class="w-full max-w-[480px] bg-surface-container-lowest border border-outline-variant rounded-xl p-6 md:p-8 flex flex-col gap-8 shadow-sm">
<!-- Brand Anchor -->
<div class="flex items-center justify-center mb-2">
<span class="font-headline-md text-headline-md font-bold text-primary tracking-tight">SCMS</span>
</div>
<!-- Header Content -->
<header class="flex flex-col gap-4 text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface">
                Verify your identity
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                We've sent a 6-digit verification code via SMS to your registered mobile number ending in <strong class="text-on-surface font-semibold">•••• 4582</strong>.
            </p>
</header>
<!-- Verification Form -->
<form class="flex flex-col gap-8" id="otpForm" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-4">
<label class="font-label-md text-label-md text-on-surface text-center md:text-left" for="otp-1">
                    Verification code
                </label>
<!-- Split Input Group -->
<div class="flex justify-between gap-2" id="otp-container">
<input aria-label="Digit 1" autocomplete="one-time-code" class="w-full aspect-[4/5] text-center font-headline-md text-headline-md border border-outline-variant rounded-lg bg-surface focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none transition-colors" id="otp-1" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 2" class="w-full aspect-[4/5] text-center font-headline-md text-headline-md border border-outline-variant rounded-lg bg-surface focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none transition-colors" id="otp-2" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 3" class="w-full aspect-[4/5] text-center font-headline-md text-headline-md border border-outline-variant rounded-lg bg-surface focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none transition-colors" id="otp-3" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 4" class="w-full aspect-[4/5] text-center font-headline-md text-headline-md border border-outline-variant rounded-lg bg-surface focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none transition-colors" id="otp-4" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 5" class="w-full aspect-[4/5] text-center font-headline-md text-headline-md border border-outline-variant rounded-lg bg-surface focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none transition-colors" id="otp-5" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 6" class="w-full aspect-[4/5] text-center font-headline-md text-headline-md border border-outline-variant rounded-lg bg-surface focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none transition-colors" id="otp-6" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-lg hover:bg-secondary transition-colors focus:ring-2 focus:ring-offset-2 focus:ring-offset-surface-container-lowest focus:ring-primary outline-none" type="submit">
                Verify
            </button>
</form>
<!-- Secondary Actions -->
<footer class="flex flex-col gap-4 text-center mt-2 border-t border-outline-variant pt-6">
<a class="font-label-md text-label-md text-primary hover:text-primary-container underline decoration-primary/30 hover:decoration-primary transition-colors inline-flex items-center justify-center gap-2 group" href="#">
<span class="material-symbols-outlined text-[18px] group-hover:rotate-180 transition-transform duration-300" data-icon="refresh">refresh</span>
                Resend code
            </a>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface underline decoration-transparent hover:decoration-outline-variant transition-colors inline-flex items-center justify-center gap-2" href="#">
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_back">arrow_back</span>
                Back to login
            </a>
</footer>
</main>
<script>
        // Micro-interaction for OTP Split Input auto-advance
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('#otp-container input');
            
            inputs.forEach((input, index) => {
                // Auto-advance on input
                input.addEventListener('input', (e) => {
                    const value = e.target.value;
                    // Ensure only numbers are entered
                    e.target.value = value.replace(/[^0-9]/g, '');
                    
                    if (e.target.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });

                // Handle backspace navigation
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        inputs[index - 1].focus();
                        // Optional: Clear the previous input when navigating back
                        // inputs[index - 1].value = ''; 
                    }
                });

                // Handle pasting a full code
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 6);
                    if (pastedData) {
                        pastedData.split('').forEach((char, i) => {
                            if (inputs[i]) {
                                inputs[i].value = char;
                                if (i < inputs.length - 1) {
                                    inputs[i + 1].focus();
                                } else {
                                    inputs[i].focus();
                                }
                            }
                        });
                    }
                });
            });

            // Focus the first input on load for immediate interaction
            if (inputs.length > 0) {
                inputs[0].focus();
            }
        });
    </script>
