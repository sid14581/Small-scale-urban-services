<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Top AppBar (Suppressed per logic: Linear/Transactional intent) -->
<!-- Main Content Canvas -->
<main class="w-full max-w-[480px]">
<!-- Brand / Header -->
<div class="mb-8 text-center">
<h1 class="font-display-lg text-display-lg text-primary mb-2">SCMS</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Smart City Management System</p>
</div>
<!-- Form Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-6 md:p-8 shadow-sm">
<div class="mb-8">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Reset Password</h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Enter your official SCMS email or username. We'll send you a secure link or code to reset your password.
                </p>
</div>
<form action="#" class="space-y-6" method="POST">
<!-- Input Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="identifier">Username or Official Email</label>
<input class="w-full px-4 py-3 bg-surface border border-outline-variant rounded-DEFAULT focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50" id="identifier" name="identifier" placeholder="e.g. j.doe@scms.gov" required="" type="text"/>
</div>
<!-- Channel Selection -->
<fieldset>
<legend class="block font-label-md text-label-md text-on-surface mb-3">Delivery Method</legend>
<div class="space-y-3">
<label class="flex items-start cursor-pointer group">
<div class="flex items-center h-6">
<input checked="" class="w-4 h-4 text-primary bg-surface border-outline-variant focus:ring-primary focus:ring-offset-surface-container-lowest focus:ring-2" id="channel-email" name="channel" type="radio" value="email"/>
</div>
<div class="ml-3">
<span class="font-body-md text-body-md text-on-surface block group-hover:text-primary transition-colors">Email Link</span>
<span class="font-body-sm text-body-sm text-on-surface-variant block">Receive a secure link via your registered email.</span>
</div>
</label>
<label class="flex items-start cursor-pointer group">
<div class="flex items-center h-6">
<input class="w-4 h-4 text-primary bg-surface border-outline-variant focus:ring-primary focus:ring-offset-surface-container-lowest focus:ring-2" id="channel-sms" name="channel" type="radio" value="sms"/>
</div>
<div class="ml-3">
<span class="font-body-md text-body-md text-on-surface block group-hover:text-primary transition-colors">SMS Code</span>
<span class="font-body-sm text-body-sm text-on-surface-variant block">Receive a 6-digit code to your registered mobile device.</span>
</div>
</label>
</div>
</fieldset>
<!-- Actions -->
<div class="pt-4 space-y-4">
<button class="w-full bg-primary hover:bg-[#005c54] text-on-primary font-label-md text-label-md py-3 px-4 rounded-DEFAULT transition-colors duration-200 flex justify-center items-center" type="submit">
                        Send reset code
                    </button>
<div class="text-center">
<a class="inline-flex items-center font-label-md text-label-md text-secondary hover:text-primary transition-colors group" href="#">
<span class="material-symbols-outlined text-[18px] mr-1 group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>
                            Back to login
                        </a>
</div>
</div>
